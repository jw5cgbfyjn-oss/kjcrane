<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

.hero{max-width:1180px;margin:0 auto;padding:72px 24px 30px}

.conveyor-wrap{overflow:hidden;width:100%;padding:24px 0 78px}

.track{display:flex;width:max-content;gap:16px;align-items:stretch;animation:move-left 190s linear infinite;will-change:transform}
.conveyor:hover .track{animation-play-state:paused}
.photo-card{display:block;flex:0 0 auto;width:min(430px,72vw);height:360px;padding:0;border:0;background:#f4f4f4;overflow:hidden;cursor:zoom-in;border-radius:4px}

@keyframes move-left{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 8px))}}
.notice{max-width:1180px;margin:0 auto;padding:0 24px 90px;color:#999;font-size:13px}
footer{border-top:1px solid #eee;padding:28px 24px 110px;color:#777;font-size:12px;line-height:1.8}
.footer-inner{max-width:1180px;margin:0 auto}
.mobile-cta{display:none}

.lightbox.open{display:flex}
.lightbox img{max-width:min(1200px,96vw);max-height:90vh;object-fit:contain}
.lightbox-close{position:absolute;right:18px;top:18px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;cursor:pointer}
