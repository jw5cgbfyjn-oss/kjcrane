<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국제크레인 인삿말 | 국제크레인</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#222;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;word-break:keep-all}
a{color:inherit;text-decoration:none}
header{height:68px;border-bottom:1px solid #eee;display:flex;align-items:center}
.head{width:min(100% - 40px,920px);margin:auto;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:17px;font-weight:800;letter-spacing:-.04em}
.back{font-size:13px;color:#666}
main{width:min(100% - 56px,760px);margin:0 auto;padding:72px 0 100px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;color:#999;margin-bottom:10px}
h1{margin:0;font-size:27px;line-height:1.3;letter-spacing:-.045em}
.redline{width:34px;height:2px;background:#d71920;margin:18px 0 30px}
.message{margin:0;color:#555;font-size:17px;line-height:2.05;letter-spacing:-.025em}
.sign{margin-top:34px;font-size:13px;color:#777}
.sign strong{margin-left:9px;color:#333;font-size:15px}
@media(max-width:760px){
 main{padding:58px 0 88px}
 h1{font-size:23px}
 .redline{width:32px;margin:16px 0 26px}
 .message{font-size:15px;line-height:2}
}
</style>
</head>
<body>
<header><div class="head"><a class="brand" href="index.html">국제크레인</a><a class="back" href="index.html">홈으로 ›</a></div></header>
<main>
  <div class="kicker">KJ CRANE</div>
  <h1>국제크레인 인삿말</h1>
  <div class="redline"></div>
  <p class="message">늘 변함없는 관심과 애정으로 지켜봐주시는 고객 여러분께<br>
  다시 한번 깊은 감사를 드리며,<br>
  깊은 신뢰와 사랑받는 기업이 되도록<br>
  최선을 다할 것을 약속드립니다.</p>
  <div class="sign">국제크레인 대표 <strong>김선원</strong></div>
</main>
</body>
</html>
