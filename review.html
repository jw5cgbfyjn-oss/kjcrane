}

<body>
<header><div class="wrap head"><a class="brand" href="index.html"><img src="kj-logo-new.png" alt="국제크레인 로고"></a><nav class="nav"><a href="index.html#about">회사소개</a><a href="inquiry.html">작업문의</a><a href="work.html">작업현장</a><a href="review.html">고객후기</a><a href="https://kko.to/UqjyMgz-Bb" target="_blank" rel="noopener">오시는 길</a><a class="phone" href="tel:01063798692">☎ 010-6379-8692</a></nav></div></header>
<main>
<section class="hero"><div class="wrap hero-row"><div><h1>고객후기</h1><p>국제크레인과 함께한 현장 경험을 확인해보세요.<br>실제 작업을 이용하신 고객님의 후기를 남길 수 있습니다.</p></div><div class="scorebox"><div class="scorebig" id="avgScore">-</div><div class="stars" id="avgStars">☆☆☆☆☆</div><div class="scoremeta" id="scoreMeta">등록된 후기 0건</div></div></div></section>
<section class="review-section"><div class="wrap">
<div class="review-top"><div class="count" id="countText">전체 0건</div><button class="write-btn" id="openWrite" type="button">후기 작성</button></div>

<div class="review-list" id="reviewList"><div class="empty" id="emptyState">등록된 후기가 없습니다.</div></div>
<div class="form-wrap" id="formWrap"><h2 class="form-title">후기 작성</h2><form id="reviewForm"><div class="grid">
<div class="field"><label>이름 <span style="color:#999;font-weight:500">(선택)</span></label><input id="rName" maxlength="20" placeholder="비워두면 익명으로 등록됩니다."></div>
<div class="field full review-private-field">
  <label class="review-private-check">
    <input type="checkbox" id="rPrivate">
    <span class="review-private-box" aria-hidden="true"></span>
    <span>비공개로 작성하기 <small>(선택)</small></span>
  </label>
</div>
<div class="field"><label>별점 <span class="req">*</span></label><div class="star-picker" aria-label="별점 선택"><input type="radio" name="rating" id="star5" value="5" required><label for="star5">★</label><input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label><input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label><input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label><input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label></div></div>
<div class="field full"><label>후기내용 <span class="req">*</span></label><textarea id="rContent" maxlength="1000" required placeholder="소중한 후기는 운영에 많은 도움이 됩니다. 감사합니다."></textarea></div>
<div class="privacy-note">※ 작성된 후기는 홈페이지에 공개됩니다. 전화번호, 정확한 주소 등 개인정보는 입력하지 마세요.</div>
</div><div class="form-actions"><button class="btn" id="cancelWrite" type="button">취소</button><button class="btn primary" type="submit">등록하기</button></div></form></div>
</div></section>
</main>
<footer><div class="wrap"><div class="footer-name">국제크레인</div><div>대표 김선원 · 춘천 중심 강원 전 지역 작업</div><div>대표번호 010-6379-8692</div></div></footer>
<script>
const SUPABASE_URL='https://topybambfbohphrfxrbg.supabase.co';
const SUPABASE_KEY='sb_publishable_xZuvRklbXZ3mQNvo2UxGBQ_Du-RNz35';
const REVIEWS=SUPABASE_URL+'/rest/v1/reviews';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('.')};
const stars=n=>'★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(n);
const isNew=v=>{const d=new Date(v);return !Number.isNaN(d.getTime())&&((Date.now()-d.getTime())<=3*24*60*60*1000)};
async function loadReviews(){
  try{
    const res=await fetch(
      SUPABASE_URL+'/rest/v1/rpc/list_public_reviews',
      {
        method:'POST',
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:'Bearer '+SUPABASE_KEY,
          'Content-Type':'application/json'
        },
        body:'{}',
        cache:'no-store'
      }
    );
    if(!res.ok) throw new Error(await res.text());
    const data=await res.json();
    render(Array.isArray(data)?data:[]);
  }catch(e){
    console.error(e);
    $('#reviewList').innerHTML='<div class="empty">후기 목록을 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>';
  }
}
function render(data){
  $('#countText').textContent='전체 '+data.length+'건';
  $('#scoreMeta').textContent='등록된 후기 '+data.length+'건';
  if(data.length){const avg=data.reduce((a,r)=>a+Number(r.rating||0),0)/data.length;$('#avgScore').textContent=avg.toFixed(1);$('#avgStars').textContent=stars(Math.round(avg));}
  else{$('#avgScore').textContent='-';$('#avgStars').textContent='☆☆☆☆☆';}
  if(!data.length){$('#reviewList').innerHTML='<div class="empty">등록된 후기가 없습니다.</div>';return}
  $('#reviewList').innerHTML=data.map(r=>`<article class="review-card"><div class="card-top"><div><div class="card-stars">${esc(stars(Number(r.rating||0)))}</div><div class="card-title">${esc(r.name)}${isNew(r.created_at)?'<span class="new-badge">N</span>':''}</div></div><div class="date">${esc(fmtDate(r.created_at))}</div></div><p class="card-content">${esc(r.content)}</p></article>`).join('');
}
$('#openWrite').addEventListener('click',()=>{$('#formWrap').classList.add('open');$('#formWrap').scrollIntoView({behavior:'smooth',block:'start'})});
$('#cancelWrite').addEventListener('click',()=>{$('#formWrap').classList.remove('open');$('#reviewForm').reset()});
$('#reviewForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const rating=document.querySelector('input[name="rating"]:checked');
  if(!rating){alert('별점을 선택해주세요.');return}
  const btn=e.submitter; if(btn){btn.disabled=true;btn.textContent='등록 중...'}
  const payload={name:$('#rName').value.trim()||'익명',rating:Number(rating.value),content:$('#rContent').value.trim(),is_private:$('#rPrivate').checked};
  try{
    const res=await fetch(REVIEWS,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error(await res.text());
    alert('후기가 등록되었습니다.');$('#reviewForm').reset();$('#formWrap').classList.remove('open');await loadReviews();window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){console.error(err);alert('후기 등록에 실패했습니다. 리뷰 DB 설정을 확인해주세요.');}
  finally{if(btn){btn.disabled=false;btn.textContent='등록하기'}}
});
loadReviews();
</script>
</body>
